name: Feature request
description: Suggest an idea or an enhancement
labels: [enhancement]
body:
  - type: checkboxes
    id: verified
    attributes:
      label: Not suggested before
      options:
        - label: I searched the existing issues and this hasn't been suggested before.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do with your sessions, and where courier got in the way or fell short.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The change you have in mind, a new tool, option or behaviour, and what it would make possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you tried, or other ways to get there.
    validations:
      required: false
