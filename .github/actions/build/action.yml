name: Build the package
description: >-
  Node 22 with npm 11 (staged publishing needs 11.15.0 or later; Node 22 bundles npm 10), Bun,
  the dependencies without their scripts, and `bun run build`. Shared by the Release workflow
  and the dry run in Tag the release, so the two cannot drift apart.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        registry-url: https://registry.npmjs.org
        package-manager-cache: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14
    - run: npm install -g "npm@>=11.15.0 <12"
      shell: bash
    - run: bun install --frozen-lockfile --ignore-scripts
      shell: bash
    - run: bun run build
      shell: bash
