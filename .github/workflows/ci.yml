name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs both suites through this before publishing.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # The published package: exports and types resolve, and the tarball holds what they point at.
      - run: npx --yes publint@0.3.25
      - run: npx --yes @arethetypeswrong/cli@0.18.5 --pack --profile esm-only

  e2e:
    name: Live test against OpenCode V2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The CLI follows the plugin API version the package is built against, so the two never drift.
      - name: Install OpenCode V2
        run: npm install -g "@opencode-ai/cli@$(node -p "require('./package.json').devDependencies['@opencode-ai/plugin']")"
      - name: Run the live test
        run: OPENCODE_BIN="$(command -v opencode2)" e2e/run.sh
        env:
          E2E_WORK: ${{ runner.temp }}/e2e
          KEEP: "1"
      - name: Upload server and model logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/*.out
          if-no-files-found: ignore
