name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs both suites through this before publishing.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test --coverage --coverage-reporter=lcov --coverage-reporter=text
      - run: bun run build
      # The published package: exports and types resolve, and the tarball holds what they point at.
      - run: npx --yes publint@0.3.25
      - run: npx --yes @arethetypeswrong/cli@0.18.5 --pack --profile esm-only
      - name: Upload coverage for the Sonar scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

  sonar:
    # SonarCloud reads the unit coverage and records issues and the quality gate on the PR. Runs
    # only where SONAR_TOKEN exists: on `main` and on pull requests from this repository. It does
    # not run for a fork's pull request, which gets no secrets, or inside the release's CI run, a
    # tag that does not need a scan of its own.
    name: SonarCloud
    needs: unit
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Sonar needs the history to tell new code from old.
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    # Required: the host at the pinned version. The `latest` leg below is the same suite on the
    # newest release and may fail.
    name: Live test against OpenCode V2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The CLI follows the plugin API version the package is built against, so the two never drift.
      - name: Install OpenCode V2
        run: npm install -g "@opencode/cli@$(node -p "require('./package.json').peerDependencies['@opencode/plugin']")"
      - name: Run the live test
        run: OPENCODE_BIN="$(command -v opencode)" e2e/run.sh
        env:
          E2E_WORK: ${{ runner.temp }}/e2e
          KEEP: "1"
      - name: Upload server and model logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/*.out
          if-no-files-found: ignore

  e2e-latest:
    # The same suite on the newest `@opencode/cli` release, so a host release that breaks the plugin
    # shows up on the next push rather than in a user's session. The build still uses the pinned
    # `@opencode/plugin`. Allowed to fail: a red run here is a warning, and the pinned leg above
    # stays the required one. The step summary names the version that ran, and so does the log
    # artifact.
    name: Live test against OpenCode V2 latest (may fail)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install the latest OpenCode V2
        id: install
        run: |
          npm install -g @opencode/cli@latest
          opencode --version
          # From the installed package, not from `opencode --version`, whose output may carry more
          # than the version.
          version=$(node -p "require('$(npm root -g)/@opencode/cli/package.json').version")
          pinned=$(node -p "require('./package.json').peerDependencies['@opencode/plugin']")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "## Live test against OpenCode V2 latest"
            echo
            echo "| | version |"
            echo "|---|---|"
            echo "| \`@opencode/cli@latest\` | $version |"
            echo "| \`@opencode/plugin\` the build uses | $pinned |"
            if [ "$version" = "$pinned" ]; then
              echo
              echo "\`latest\` is the pinned version today, so this run repeats the pinned leg."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=OpenCode latest::The latest leg runs on @opencode/cli@$version (the plugin is built against @opencode/plugin@$pinned)"
      - name: Run the live test
        run: OPENCODE_BIN="$(command -v opencode)" e2e/run.sh
        env:
          E2E_WORK: ${{ runner.temp }}/e2e
          KEEP: "1"
      - name: Report the outcome
        if: always()
        env:
          # Empty when the install step itself failed.
          VERSION: ${{ steps.install.outputs.version || 'unknown' }}
          OUTCOME: ${{ job.status }}
        run: |
          echo "Outcome on @opencode/cli@$VERSION: $OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != success ]; then
            echo "::warning title=OpenCode latest::The live suite did not pass on @opencode/cli@$VERSION; the pinned leg decides"
          fi
      - name: Upload server and model logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-latest-${{ steps.install.outputs.version || 'unknown' }}
          path: |
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/*.out
          if-no-files-found: ignore
