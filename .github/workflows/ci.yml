name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs both suites through this before publishing.
  workflow_call:

# A new push to a pull request cancels its running CI; a push to `main` and a release's run finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The release tags too, for the check of the Supported OpenCode version tables.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The version tables in README.md and docs/reference.md come from the release tags (release-start.yml writes them).
      - run: bun script/compat-table.ts --check
      - run: bun test --coverage --coverage-reporter=lcov --coverage-reporter=text
      - run: bun run build
      # The published package: exports and types resolve, and the tarball holds what they point at.
      - run: npx --yes publint@0.3.25
      - run: npx --yes @arethetypeswrong/cli@0.18.5 --pack --profile esm-only
      - name: Upload coverage for the Sonar scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

  sonar:
    # SonarCloud reads the unit coverage and records issues and the quality gate on the PR, and the
    # job fails when the gate does (`sonar.qualitygate.wait` in sonar-project.properties). Runs only
    # where SONAR_TOKEN exists: on `main` and on pull requests from this repository. It does not run
    # for a fork's pull request, which gets no secrets, or inside the release's CI run, a tag that
    # does not need a scan of its own.
    name: SonarCloud
    needs: unit
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Sonar needs the history to tell new code from old.
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  changes:
    # Whether the pull request touches more than documentation. The live suites run only if it does:
    # anything but README.md, other Markdown, docs/ and .claude/. Every other event, a push to
    # `main` or a release's run, runs them. The unit job runs either way, with test/links.test.ts.
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # The merge commit of the pull request and its two parents: HEAD^1 is the base it merges into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && git rev-parse --verify -q 'HEAD^2' >/dev/null; then
            code=false
            # --no-renames: a file renamed into docs/ still shows up under the path it came from.
            while IFS= read -r file; do
              case $file in
                README.md | docs/* | .claude/* | *.md) ;;
                *)
                  code=true
                  echo "not documentation: $file"
                  ;;
              esac
            done < <(git diff --no-renames --name-only 'HEAD^1' HEAD)
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Changes beyond documentation: $code" >> "$GITHUB_STEP_SUMMARY"

  e2e-run:
    # The live suite in four shards, each on its own runner with its own server, mock model and
    # stand-in registry: e2e/run.sh with E2E_SHARD=k/4 (docs/maintainers/development.md). The count is
    # in the matrix, in E2E_SHARD and in the name; keep them equal.
    name: Live suite (run.sh, shard ${{ matrix.shard }} of 4)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The CLI follows the plugin API version the package is built against, so the two never drift.
      - name: Install OpenCode V2
        run: npm install -g "@opencode/cli@$(node -p "require('./package.json').peerDependencies['@opencode/plugin']")"
      - name: Run the live test
        run: OPENCODE_BIN="$(command -v opencode)" e2e/run.sh
        env:
          E2E_SHARD: ${{ matrix.shard }}/4
          E2E_WORK: ${{ runner.temp }}/e2e
          KEEP: "1"
      - name: Upload server and model logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/*.out
            ${{ runner.temp }}/e2e/timings.tsv
          if-no-files-found: ignore

  e2e-tui:
    name: Live suite of the TUI part (tui.sh)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install OpenCode V2
        run: npm install -g "@opencode/cli@$(node -p "require('./package.json').peerDependencies['@opencode/plugin']")"
      # The runner image lists no tmux, which the TUI's live test runs the TUI in.
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Run the live test of the TUI part
        run: OPENCODE_BIN="$(command -v opencode)" e2e/tui.sh
        env:
          E2E_WORK: ${{ runner.temp }}/e2e-tui
          KEEP: "1"
      - name: Upload server and model logs and the TUI's screens
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-tui-logs
          path: |
            ${{ runner.temp }}/e2e-tui/*.log
            ${{ runner.temp }}/e2e-tui/*.out
            ${{ runner.temp }}/e2e-tui/*.err
            ${{ runner.temp }}/e2e-tui/*.txt
          if-no-files-found: ignore

  e2e:
    # The required check: the host at the pinned version, every run.sh shard and tui.sh together, as the
    # one job that ran them both was. It is a job of its own so the name stays what the branch ruleset
    # requires while the suites run as separate jobs, and so a pull request that changes only
    # documentation passes it with the live jobs skipped (a skipped job is a pass; a skipped
    # workflow would leave the check pending).
    name: Live test against OpenCode V2
    needs: [changes, e2e-run, e2e-tui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - run: |
          echo "changes, run.sh shards, tui.sh: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac

