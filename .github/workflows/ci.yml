name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun script/compat-table.ts --check
      - run: bun test --coverage --coverage-reporter=lcov --coverage-reporter=text
      - run: bun run build
      - run: npx --yes publint@0.3.25
      - run: npx --yes @arethetypeswrong/cli@0.18.5 --pack --profile esm-only
      - name: Upload coverage for the Sonar scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

  sonar:
    name: SonarCloud
    needs: unit
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && git rev-parse --verify -q 'HEAD^2' >/dev/null; then
            code=false
            while IFS= read -r file; do
              case $file in
                README.md | docs/* | .claude/* | *.md) ;;
                *)
                  code=true
                  echo "not documentation: $file"
                  ;;
              esac
            done < <(git diff --no-renames --name-only 'HEAD^1' HEAD)
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Changes beyond documentation: $code" >> "$GITHUB_STEP_SUMMARY"

  e2e-run:
    name: Live suite (run.sh, shard ${{ matrix.shard }} of 4)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install OpenCode V2
        run: npm install -g "@opencode/cli@$(node -p "require('./package.json').peerDependencies['@opencode/plugin']")"
      - name: Run the live test
        run: OPENCODE_BIN="$(command -v opencode)" e2e/run.sh
        env:
          E2E_SHARD: ${{ matrix.shard }}/4
          E2E_WORK: ${{ runner.temp }}/e2e
          KEEP: "1"
      - name: Upload server and model logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/*.out
            ${{ runner.temp }}/e2e/timings.tsv
          if-no-files-found: ignore

  e2e-tui:
    name: Live suite of the TUI part (tui.sh)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install OpenCode V2
        run: npm install -g "@opencode/cli@$(node -p "require('./package.json').peerDependencies['@opencode/plugin']")"
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Run the live test of the TUI part
        run: OPENCODE_BIN="$(command -v opencode)" e2e/tui.sh
        env:
          E2E_WORK: ${{ runner.temp }}/e2e-tui
          KEEP: "1"
      - name: Upload server and model logs and the TUI's screens
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-tui-logs
          path: |
            ${{ runner.temp }}/e2e-tui/*.log
            ${{ runner.temp }}/e2e-tui/*.out
            ${{ runner.temp }}/e2e-tui/*.err
            ${{ runner.temp }}/e2e-tui/*.txt
          if-no-files-found: ignore

  e2e:
    name: Live test against OpenCode V2
    needs: [changes, e2e-run, e2e-tui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - run: |
          echo "changes, run.sh shards, tui.sh: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac

