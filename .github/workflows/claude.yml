name: Claude review

# A first review of a pull request by Claude Code, on demand only: a maintainer comments
# `@claude review` (or any `@claude` request) on the pull request. It runs on the maintainer's Claude
# subscription (the CLAUDE_CODE_OAUTH_TOKEN secret, from `claude setup-token`), so nothing runs on
# its own. It reads the diff and CI's results and runs none of the pull request's code.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  review:
    name: Claude review
    if: |
      contains(github.event.comment.body, '@claude') &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: anthropics/claude-code-action@1c5885c47d990edfb453ca2e7890bc22a3d950cf # v1.0.260
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(git diff:*),Bash(git log:*)"
            --append-system-prompt "You review pull requests to opencode-courier. Check the change against CLAUDE.md's rules: unit tests and an e2e/run.sh scenario for a behaviour change, README.md and docs/reference.md updated, test/__snapshots__/ updated for a model-facing string, the import rules in docs/maintainers/architecture.md, the tool rules. Read CI's results with gh pr checks instead of running anything. Lead with real defects, each with the file and line; say plainly when you found none. Keep it short."
