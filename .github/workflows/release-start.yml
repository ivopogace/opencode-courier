name: Start a release

# Step one of a release (Releasing in README.md): bumps `version` in package.json on a branch
# and opens the "Release X.Y.Z" pull request. Merging it tags main (release-tag.yml), and the tag
# is staged on npm (release.yml). Everything here uses the job's GITHUB_TOKEN; GitHub holds the
# pull request's CI runs until a maintainer selects "Approve workflows to run" on it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "patch, minor or major, or an exact version such as 0.2.0 or 0.2.0-beta.1"
        type: string
        required: true
        default: patch
      dry_run:
        description: "Compute the bump and show the change; push no branch, open no pull request"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  start:
    name: Open the release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the release branch
      pull-requests: write # open the pull request
    steps:
      # Keeps the token in the checkout: the release branch is pushed with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      # `npm version` takes a bump keyword or an exact version and refuses an unchanged one, but
      # accepts a lower one; a release only goes forward (npm's own semver decides). The tag, the
      # branch and npm must all be free of the version, and the current version must be tagged,
      # or a release Tag the release missed would be skipped over for good.
      - name: Bump the version
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "${VERSION}" in
            patch | minor | major) ;;
            *)
              if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                echo "::error::version must be patch, minor, major or an exact version such as 0.2.0 or 0.2.0-beta.1, not ${VERSION}"
                exit 1
              fi ;;
          esac
          current="$(node -p "require('./package.json').version")"
          if ! git ls-remote --exit-code --tags origin "refs/tags/v${current}" >/dev/null; then
            echo "::error::the current version ${current} has no tag v${current}: release it first (Tag the release on main with dry_run off, or by hand: Releasing in README.md)"
            exit 1
          fi
          npm version "${VERSION}" --no-git-tag-version >/dev/null
          version="$(node -p "require('./package.json').version")"
          echo "version: ${current} -> ${version}"
          if ! node -e "process.exit(require('$(npm root -g)/npm/node_modules/semver').gt('${version}', '${current}') ? 0 : 1)"; then
            echo "::error::${version} is not newer than ${current}"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "::error::tag v${version} already exists"
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/release-${version}" >/dev/null; then
            echo "::error::branch release-${version} already exists: finish or delete that release first"
            exit 1
          fi
          if [ "$(.github/scripts/npm-has-version.sh "${version}")" = yes ]; then
            echo "::error::opencode-courier@${version} is already on npm"
            exit 1
          fi
          git --no-pager diff
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
      - name: Report the dry run
        if: inputs.dry_run
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          echo "Dry run: would push release-${VERSION} and open the pull request \"Release ${VERSION}\"." >>"${GITHUB_STEP_SUMMARY}"
      - name: Push the release branch and open the pull request
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release-${VERSION}"
          git commit --all --message "Release ${VERSION}"
          git push origin "release-${VERSION}"
          {
            echo "Bumps \`package.json\` to ${VERSION}. Started by @${GITHUB_ACTOR} with the Start a release workflow (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo "GitHub holds the checks of a pull request that GitHub Actions opened: select **Approve workflows to run** in the merge box to start them."
            echo
            echo "Merging this tags main with \`v${VERSION}\` (Tag the release) and stages the version on npm (Release). Then approve it with 2FA on npmjs.com under Staged Packages and publish the draft GitHub release: Releasing in README.md."
          } >"${RUNNER_TEMP}/pull-request.md"
          # A branch without its pull request would block the next attempt: take it back.
          if ! url="$(gh pr create --base main --head "release-${VERSION}" --title "Release ${VERSION}" --body-file "${RUNNER_TEMP}/pull-request.md")"; then
            git push origin --delete "release-${VERSION}"
            echo "::error::could not open the pull request (is \"Allow GitHub Actions to create and approve pull requests\" on, under Settings → Actions → General?); branch release-${VERSION} is deleted again"
            exit 1
          fi
          echo "Opened ${url}: approve its workflows to run, review, and merge it to release ${VERSION}." >>"${GITHUB_STEP_SUMMARY}"
