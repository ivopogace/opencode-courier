name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and `npm stage publish --dry-run`; stage nothing, create no release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Stage on npm
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      NPM_AUTH: ${{ vars.NPM_AUTH || 'token' }}
      NPM_PROVENANCE: ${{ vars.NPM_PROVENANCE }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - name: Check the release settings
        run: |
          case "${NPM_AUTH}" in
            token | oidc) echo "authenticating to npm with: ${NPM_AUTH}" ;;
            *) echo "::error::NPM_AUTH must be token or oidc, not ${NPM_AUTH}"; exit 1 ;;
          esac
          case "${NPM_PROVENANCE,,}" in
            "" | true | false) ;;
            *) echo "::error::NPM_PROVENANCE must be true or false, not ${NPM_PROVENANCE}"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - uses: ./.github/actions/build
      - name: Check the npm token
        if: env.NPM_AUTH == 'token'
        run: |
          if [ "${HAS_TOKEN}" != true ]; then
            if [ "${DRY_RUN}" = true ]; then
              echo "::warning::no NPM_TOKEN secret in the npm environment yet: a release needs one (see docs/maintainers/releasing.md); the dry run goes on without it"
              exit 0
            fi
            echo "::error::no NPM_TOKEN secret in the npm environment: add a granular access token (see docs/maintainers/releasing.md)"
            exit 1
          fi
          npm whoami || { echo "::error::npm does not accept NPM_TOKEN: it may have expired or been revoked"; exit 1; }
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Check the OIDC token for npm
        if: env.NPM_AUTH == 'oidc'
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" ]; then
            echo "::error::no OIDC token available: the job needs 'permissions: id-token: write'"
            exit 1
          fi
          # shellcheck disable=SC2016
          node --input-type=module -e '
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
            url.searchParams.set("audience", "npm:registry.npmjs.org")
            const res = await fetch(url, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } })
            if (!res.ok) {
              console.log(`::error::GitHub refused the OIDC token request: HTTP ${res.status}`)
              process.exit(1)
            }
            const { value } = await res.json()
            const claims = JSON.parse(Buffer.from(value.split(".")[1], "base64url").toString())
            for (const key of ["aud", "sub", "repository", "repository_owner", "repository_visibility", "workflow_ref", "job_workflow_ref", "environment", "ref", "event_name"]) {
              console.log(`${key}: ${claims[key] ?? "(missing)"}`)
            }
          '
      - name: Stage
        run: |
          flags=(--access public)
          if [ "${DRY_RUN}" = true ]; then flags+=(--dry-run); fi
          if [ "${NPM_AUTH}" = token ]; then
            export NODE_AUTH_TOKEN="${NPM_TOKEN}"
            if [ "${NPM_PROVENANCE,,}" != false ]; then flags+=(--provenance); fi
          else
            flags+=(--loglevel verbose)
          fi
          case "${GITHUB_REF_NAME}" in *-*) flags+=(--tag next) ;; esac
          npm stage publish "${flags[@]}"
        env:
          NPM_TOKEN: ${{ env.NPM_AUTH == 'token' && secrets.NPM_TOKEN || '' }}

  github-release:
    name: Draft GitHub release
    needs: publish
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create a draft release with generated notes
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --draft $prerelease
          {
            echo "${GITHUB_REF_NAME} is staged on npm. Approve it with 2FA on npmjs.com (Staged Packages),"
            echo "then publish the draft release: gh release edit ${GITHUB_REF_NAME} --draft=false"
          } >>"${GITHUB_STEP_SUMMARY}"
        env:
          GH_TOKEN: ${{ github.token }}
