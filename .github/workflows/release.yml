name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The npm trusted publisher names this environment; add a required reviewer to it in the repo
    # settings to approve each release.
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing, which also adds provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # Node 22 bundles npm 10; trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      # Trusted publishing (OIDC) authenticates and adds provenance; no token is involved.
      # Prereleases (1.2.0-beta.1) go to the `next` dist-tag; npm 11 refuses them without one.
      - name: Publish
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) npm publish --access public --tag next ;;
            *)   npm publish --access public ;;
          esac

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release with generated notes
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes $prerelease
        env:
          GH_TOKEN: ${{ github.token }}
