# TEMPORARY (#344): runs the unit tests repeatedly to catch the #281 hang with the tracer on.
name: Trace 344

on:
  push:
    branches: [issue-344-digby-hang]

permissions:
  contents: read

jobs:
  trace:
    name: Trace ${{ matrix.copy }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ vars.TRACE_BUN || '1.3.14' }}
      - run: bun install --frozen-lockfile
      - name: The full suite three times
        run: |
          for n in 1 2 3; do
            bun test --coverage --coverage-reporter=lcov --coverage-reporter=text > full$n.txt 2>&1 || true
            echo "== full$n"
            grep -a "timed out\|(fail)\|^Ran " full$n.txt | head -20
            if grep -aq "timed out" full$n.txt; then
              echo "-- files in order"; grep -a "^test/.*:$" full$n.txt | tr '\n' ' '; echo
              echo "-- errors"; grep -a -B3 -A12 "Unhandled error\|^error:\|TypeError" full$n.txt | head -150
              awk '/^#344 renderer/,/^#344 end/' full$n.txt
            fi
          done
          ! grep -aq "timed out" full1.txt full2.txt full3.txt
