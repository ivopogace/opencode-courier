# TEMPORARY (#344): runs the unit tests repeatedly to catch the #281 hang with the tracer on.
name: Trace 344

on:
  push:
    branches: [issue-344-digby-hang]

permissions:
  contents: read

jobs:
  trace:
    name: Trace bun ${{ matrix.bun }} copy ${{ matrix.copy }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        bun: [1.3.14]
        copy: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - name: Bun alone, immediates under fake timers
        run: |
          bun test ./trace-344/immediate.repro.ts --rerun-each 30 > repro.txt 2>&1 || true
          grep -a "timed out\|(fail)\|^Ran \| pass$\| fail$" repro.txt | sort | uniq -c | head -20
      - name: The full suite twice
        run: |
          for n in 1 2; do
            bun test --coverage --coverage-reporter=lcov --coverage-reporter=text > full$n.txt 2>&1 || true
            echo "== full$n"
            grep -a "timed out\|(fail)\|^Ran " full$n.txt | head -20
            if grep -aq "timed out" full$n.txt; then
              awk '/^#344 renderer/,/^#344 end/' full$n.txt | grep -a "^#344 renderer\|imm\|> \|T " | tail -14
            fi
          done
          ! grep -aq "timed out" full1.txt full2.txt repro.txt
