# TEMPORARY (#344): runs the unit tests repeatedly to catch the #281 hang with the tracer on.
name: Trace 344

on:
  push:
    branches: [issue-344-digby-hang]

permissions:
  contents: read

jobs:
  trace:
    name: Trace ${{ matrix.copy }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Full suite, then the TUI tests ten times
        run: |
          bun test --coverage --coverage-reporter=lcov --coverage-reporter=text > full.txt 2>&1 || true
          bun test --coverage test/tui.test.tsx --rerun-each 10 > tui.txt 2>&1 || true
          for f in full.txt tui.txt; do
            echo "== $f"
            grep -a "timed out\|(fail)\|^Ran \| pass$\| fail$" "$f" | head -40
            awk '/^#344 renderer/,/^#344 end/' "$f"
          done
          ! grep -aq "timed out" full.txt tui.txt
