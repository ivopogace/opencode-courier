# SonarCloud: the `sonar` job in .github/workflows/ci.yml scans with these settings. Automatic
# Analysis stays off for the project, since it can read no coverage.
sonar.projectKey=ivopogace_opencode-courier
sonar.organization=swap-shop

# The package's own code. The unit suites are tests, so their findings and lines do not count as
# product code. The e2e harness and the real-model scripts are left out: they only drive a server
# in tests and never ship.
sonar.sources=src
sonar.tests=test

# Written by `bun test --coverage` in the `unit` job. Its paths are already relative to the repo
# root. Only the unit suites count toward coverage, because the live e2e suite runs the built
# plugin inside an OpenCode server, which records no coverage.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The scan waits for the quality gate's verdict and fails when the gate does, so the `SonarCloud`
# job goes red on a PR or a `main` push that misses it, rather than passing once the report is
# uploaded. The wait is bounded by `sonar.qualitygate.timeout`, 300 seconds by default.
sonar.qualitygate.wait=true
